<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <title>StratMind - 意思決定インテリジェンス</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}" />
</head>

<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="app-header__brand">
        <div class="logo-icon">
          <!-- Simple SVG Logo -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <div class="header-text">
          <h1 class="app-title">StratMind</h1>
          <p class="app-subtitle">意思決定インテリジェンス</p>
        </div>
      </div>
      <div class="app-header__actions">
        <label class="toggle-switch">
          <input type="checkbox" id="demo-mode-checkbox" checked>
          <span class="toggle-slider"></span>
          <span class="toggle-label">デモモード</span>
        </label>

        <div class="action-group">
          <button id="google-import-btn" class="button button--secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"
              style="margin-right:4px; color:#4285F4;">
              <path
                d="M12.01 1.485c-1.08 0-2.09.56-2.66 1.485L2.35 15.145c-.56.975-.56 2.145 0 3.12.55.955 1.55 1.535 2.62 1.535h14.06c1.08 0 2.09-.56 2.66-1.485l-7.01-12.78c-.56-.975-1.55-1.535-2.66-1.535zm-1.05 3.33l6.09 11.235h-12.18l6.09-11.235z" />
              <path d="M8.333 16.667L12 10.333L15.667 16.667H8.333Z" fill="white" />
              <path
                d="M7.71 3.5L1.15 15C0.65 15.89 0.65 17 1.15 17.89L2.88 20.89C3.37 21.78 4.3 22.33 5.32 22.33H18.68C19.7 22.33 20.63 21.78 21.12 20.89L22.85 17.89C23.35 17 23.35 15.89 22.85 15.01L16.29 3.5C15.79 2.61 14.86 2.06 13.84 2.06H10.16C9.14 2.06 8.21 2.61 7.71 3.5Z"
                fill="none" />
            </svg>
            Driveから読込
          </button>
          <button id="save-snapshot-btn" class="button button--secondary">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path>
            </svg>
            下書き保存
          </button>
          <button id="update-review-btn" class="button button--primary button--glow">
            <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z">
              </path>
            </svg>
            AIレビューを実行
          </button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <!-- Editor Area (Document Stick) -->
      <section class="document-area">
        <div class="document-paper">
          <div class="document-header">
            <input id="idea-title" class="document-title-input" type="text" placeholder="無題の企画書" />
          </div>
          <div class="document-body">
            <textarea id="idea-body" class="document-textarea"
              placeholder="ここに企画の背景、狙い、ユーザー像、ユースケース、収益モデルなどを記述してください..."></textarea>
          </div>
        </div>
      </section>

      <!-- Sidebar (AI Assistant) -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h2 class="sidebar-title">AI コパイロット</h2>
        </div>

        <div id="global-message" class="global-message" role="status" aria-live="polite"></div>

        <div class="tab-group" role="tablist">
          <button id="tab-questions" class="tab-pill tab-pill--active" role="tab">レビュー</button>
          <button id="tab-cases" class="tab-pill" role="tab">類似事例</button>
        </div>

        <div class="sidebar-content">
          <section id="panel-questions" class="tab-panel tab-panel--active" role="tabpanel">
            <div id="questions-list" class="cards-stack">
              <div class="empty-state">
                <div class="empty-icon">✨</div>
                <p>分析の準備ができました。<br>「AIレビューを実行」をクリックしてください。</p>
              </div>
            </div>
          </section>

          <section id="panel-cases" class="tab-panel" role="tabpanel" hidden>
            <div id="cases-list" class="cards-stack">
              <div class="empty-state">
                <p>類似事例はまだありません。</p>
              </div>
            </div>
          </section>
        </div>
      </aside>
    </main>
  </div>

  <!-- Drive File Picker Dialog -->
  <dialog id="drive-dialog" class="modal">
    <div class="modal-content">
      <header class="modal-header">
        <h3>Googleドライブから選択</h3>
        <button id="close-dialog-btn" class="close-btn">×</button>
      </header>
      <div class="modal-body">
        <ul id="drive-files-list" class="files-list">
          <li class="loading">読み込み中...</li>
        </ul>
      </div>
    </div>
  </dialog>

  <script src="{{ url_for('static', path='/js/app.js') }}" defer></script>
</body>

</html>
